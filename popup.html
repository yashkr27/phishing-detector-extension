<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhishGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="logo">
      <div class="shield-icon" id="shieldIcon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L3 6v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V6L12 2z" fill="currentColor"/>
          <path d="M9 12l2 2 4-4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shield-check" id="shieldCheck"/>
          <path d="M9 9l6 6M15 9l-6 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shield-x" id="shieldX" style="display:none"/>
        </svg>
      </div>
      <span class="logo-text">PhishGuard</span>
    </div>
    <button class="settings-btn" id="settingsBtn" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <!-- URL Display -->
  <div class="url-bar">
    <div class="url-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
    </div>
    <span class="url-text" id="urlText">Loading…</span>
  </div>

  <!-- Main Result Card -->
  <main class="result-card" id="resultCard">

    <!-- Loading State -->
    <div class="state loading-state" id="loadingState">
      <div class="spinner-ring">
        <div class="spinner"></div>
      </div>
      <p class="state-label">Analyzing URL…</p>
      <p class="state-sub">Checking against phishing model</p>
    </div>

    <!-- Safe State -->
    <div class="state safe-state" id="safeState" style="display:none">
      <div class="verdict-icon safe-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
      </div>
      <h2 class="verdict-label safe">SAFE</h2>
      <p class="verdict-sub">This site appears legitimate</p>
      <div class="confidence-section">
        <div class="confidence-header">
          <span>Confidence</span>
          <span id="safeConfidenceVal">—</span>
        </div>
        <div class="confidence-track">
          <div class="confidence-fill safe-fill" id="safeConfidenceFill"></div>
        </div>
      </div>
    </div>

    <!-- Phishing State -->
    <div class="state phishing-state" id="phishingState" style="display:none">
      <div class="verdict-icon phishing-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 9v4M12 17h.01"/>
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        </svg>
      </div>
      <h2 class="verdict-label phishing">PHISHING</h2>
      <p class="verdict-sub">Potential threat detected!</p>
      <div class="confidence-section">
        <div class="confidence-header">
          <span>Threat Confidence</span>
          <span id="phishConfidenceVal">—</span>
        </div>
        <div class="confidence-track">
          <div class="confidence-fill phish-fill" id="phishConfidenceFill"></div>
        </div>
      </div>
    </div>

    <!-- Error State -->
    <div class="state error-state" id="errorState" style="display:none">
      <div class="verdict-icon error-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 8v4M12 16h.01"/>
        </svg>
      </div>
      <h2 class="verdict-label error">ERROR</h2>
      <p class="verdict-sub" id="errorMsg">Could not reach the API</p>
    </div>

    <!-- Not Scannable State -->
    <div class="state noscan-state" id="noscanState" style="display:none">
      <div class="verdict-icon noscan-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M8 12h8"/>
        </svg>
      </div>
      <h2 class="verdict-label noscan">NOT SCANNED</h2>
      <p class="verdict-sub">Internal pages cannot be analyzed</p>
    </div>

  </main>

  <!-- Action Buttons -->
  <footer class="actions">
    <button class="btn-rescan" id="rescanBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Rescan
    </button>
    <div class="timestamp" id="timestamp"></div>
  </footer>

  <script src="popup.js" type="module"></script>
</body>
</html>
